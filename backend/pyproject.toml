[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nasion-G", email = "golloshi.nasion@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "encodec>=0.1.1",
    "fastapi[standard]>=0.141.1",
    "onnxruntime>=1.28.0",
    "onnxscript>=0.7.1",
    "torchaudio>=2.11.0",
    "torchcodec>=0.15.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
